function plan(since){

 const changes=[];let count=0;
 const recent=e=>{const at=e?.answeredAt??e?.at??e?.capturedAt??e?.ts;return typeof at==='string'&&Number.isFinite(Date.parse(at))&&Date.parse(at)>=cutoff;};
 for(const key of recordKeys){const raw=window.localStorage.getItem(key);if(raw===null)continue;let v;try{v=JSON.parse(raw);}catch{throw Error('読み取れない記録があります。先にJSONを保全してください。');}

 if(Array.isArray(v))v=filter(v);
 else if(v&&typeof v==='object'){
  if(key==='yuika_cleared'){for(const [k,e] of Object.entries(v))if(recent(e)){delete v[k];removed++;}}
  else for(const name of ['events','legacy'])if(Array.isArray(v[name]))v[name]=filter(v[name]);

 if(removed){count+=removed;changes.push({key,raw,next:JSON.stringify(v)});}
 }

}
function remove(plan){
 // Prevent a stale confirmation from overwriting another tab's answers.
 for(const c of plan.changes)if(window.localStorage.getItem(c.key)!==c.raw)throw Error('記録が更新されました。件数を確認し直してください。');
 const written=[];
 try{for(const c of plan.changes){window.localStorage.setItem(c.key,c.next);written.push(c);}}
 catch{
  let restored=true;
  for(const c of written.reverse())try{
   // A different tab's newer value must never be overwritten by rollback.
   if(window.localStorage.getItem(c.key)!==c.next){restored=false;continue;}
   window.localStorage.setItem(c.key,c.raw);
   if(window.localStorage.getItem(c.key)!==c.raw)restored=false;
  }catch{restored=false;}
  const error=Error(restored?'削除は完了していません。変更済みの記録を元に戻しました。削除前のJSONを保全し、件数を確認し直してください。':'削除途中で保存に失敗し、一部の記録の復元を確認できません。この画面を閉じず「削除前のJSONを保全」で原本を保存してください。');
  error.recovery=plan;error.incomplete=!restored;throw error;
 }
}
function exportRecovery(plan){
 const blob=new Blob([JSON.stringify({format:'yuika-parent-cleanup-backup-v1',records:plan.changes.map(c=>({key:c.key,raw:c.raw}))},null,2)],{type:'application/json'});
 const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='yuika-before-cleanup.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);

 banner.innerHTML='<strong>保護者確認モード（記録・通知なし）</strong> <button id="parent-exit" type="button">終了</button><div id="parent-notification-status" role="status"></div><details><summary>保護者：既存の子どもの記録を整理</summary><p>このブラウザー内の全単元・旧版・試作の日時付き記録が対象です。先に各画面からJSONを保管し、他の学習タブを閉じてください。日時のない旧集計は保持します。送信済み通知は取り消せません。</p><label>指定日時以降（この端末の時刻）<input id="parent-since" type="datetime-local"></label><button id="parent-count" type="button">削除件数を確認</button><p id="parent-delete-status" role="status"></p><button id="parent-delete" type="button" disabled>子どもの記録を削除</button> <button id="parent-backup" type="button" hidden>削除前のJSONを保全</button></details>';
 document.body.prepend(banner);document.getElementById('parent-exit').onclick=exit;
 let pending=null,recovery=null,incomplete=false;const backup=document.getElementById('parent-backup');backup.onclick=()=>{if(recovery)exportRecovery(recovery);};const result=document.getElementById('parent-delete-status'),button=document.getElementById('parent-delete');
 document.getElementById('parent-since').oninput=()=>{pending=null;button.disabled=true;result.textContent='日時を変更しました。件数を再確認してください。';};
 document.getElementById('parent-count').onclick=()=>{if(incomplete){result.textContent='復元未確認の記録があります。先に削除前のJSONを保全し、この画面で追加の削除をしないでください。';return;}try{pending=plan(document.getElementById('parent-since').value);result.textContent=`削除対象：${pending.count}件`;button.disabled=!pending.count;}catch(e){pending=null;button.disabled=true;result.textContent=e.message;}};
 button.onclick=()=>{if(!pending||!confirm(`${pending.count}件の子どもの記録を削除します。元に戻せません。削除しますか？`))return;try{remove(pending);result.textContent=`${pending.count}件を削除しました。終了すると再集計されます。`;pending=null;button.disabled=true;}catch(e){if(e.recovery){recovery=e.recovery;incomplete=e.incomplete;backup.hidden=false;}result.textContent=e.message;pending=null;button.disabled=true;}};
 if(temporary){document.getElementById('parent-count').disabled=true;document.getElementById('parent-since').disabled=true;}
 suppress();
}
window.YuikaParent={get active(){return active;},storage,suppress,navigate};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();

<script>
/* Shared source, embedded in each HTML to preserve single-file use. */
(()=>{
'use strict';
const CONFIG='yuika-mail-config-v1',PREFIX='yuika-mail-job-v1:';
const memory=new Map();let busy=false,last='',timer=null;
const id=()=>crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),v=>v.toString(16).padStart(2,'0')).join('');
function config(){try{return JSON.parse(window.YuikaParent.storage.getItem(CONFIG)||'null');}catch{return null;}}
function store(job){memory.set(job.report?.id||job.id,job);try{window.YuikaParent.storage.setItem(PREFIX+(job.report?.id||job.id),JSON.stringify(job));return true;}catch{last='通知の保留データを保存できません。この画面を閉じる前に接続を確認してください。学習記録の保存状況も確認してください。';return false;}}
function jobs(){const all=new Map(memory);try{for(let i=0;i<window.YuikaParent.storage.length;i++){const k=window.YuikaParent.storage.key(i);if(k?.startsWith(PREFIX)){try{const v=JSON.parse(window.YuikaParent.storage.getItem(k));if(v&&typeof v.id==='string'&&!all.has(v.id))all.set(v.id,v);}catch{last='読み取れない通知記録があります。上書きせず保管しています。';}}}}catch{}return [...all.values()];}
function show(){const el=document.getElementById('yuika-mail-status');if(!el)return;const cfg=config(),pending=jobs().filter(j=>j.status!=='accepted').length;
 el.textContent=last||(!cfg?.enabled?'自動メールは未接続です。接続後のチャレンジから通知します。':`自動メールは接続済みです。${pending?`保留 ${pending}件。アプリを開いている間に再試行します。`:'通知の保留はありません。'}`);
}
function schedule(){clearTimeout(timer);timer=setTimeout(()=>flush(),60_000);}
async function process(){if(window.YuikaParent.suppress())return;const cfg=config();if(!cfg?.enabled||!navigator.onLine){show();return;}
 for(const job of jobs().filter(j=>j.status==='pending').slice(0,10)){
  if(!config()?.enabled)break;
  if(job.endpoint!==cfg.endpoint||job.recipient!==cfg.recipient){last='以前の送信先向けの保留通知があります。送信先が違うため自動送信していません。';continue;}
  if(job.nextAttempt>Date.now())continue;
  try{
   if(window.YuikaParent.suppress())return;
   const r=await fetch(cfg.endpoint+'/reports',{method:'POST',credentials:'omit',headers:{'Content-Type':'application/json',Authorization:'Bearer '+cfg.token},body:JSON.stringify(job.report),signal:AbortSignal.timeout(20_000)});
   const body=await r.json();
   if(r.ok&&body.accepted===true){store({id:job.id,status:'accepted',acceptedAt:new Date().toISOString(),endpoint:job.endpoint,recipient:job.recipient});last='今回の通知を送信サービスが受け付けました（受信箱への到着確認ではありません）。';}
   else if(r.status===401||r.status===403){last='通知の接続認証を確認してください。結果は保留しています。';break;}
   else if(r.status===409||r.status===400||r.status===413){job.status='needs_review';job.error=body.error||'invalid_report';store(job);last='確認が必要な通知があります。二重送信を防ぐため、自動再送を止めています。';}
   else{job.tries=(job.tries||0)+1;job.nextAttempt=Date.now()+Math.min(3600000,60000*2**Math.min(job.tries,6));store(job);last='メール送信は保留中です。次回の起動時などに再試行します。';}
  }catch{job.tries=(job.tries||0)+1;job.nextAttempt=Date.now()+Math.min(3600000,60000*2**Math.min(job.tries,6));store(job);last='通信できないため通知を保留しています。学習は続けられます。';}
 }
 show();
}
async function flush(){if(window.YuikaParent.suppress())return;if(busy)return;busy=true;try{if(navigator.locks)await navigator.locks.request('yuika-mail-send',process);else await process();}finally{busy=false;schedule();}}
function enqueue(report){
 if(window.YuikaParent.suppress())return false;
 const cfg=config();if(!cfg?.enabled){last='自動メールは未接続です。今回の結果は学習記録で確認できます。';show();return false;}
 if(!report||!report.id||jobs().some(j=>j.id===report.id)){show();return true;}
 let old;try{old=window.YuikaParent.storage.getItem(PREFIX+report.id);}catch{}
 if(old!==null&&old!==undefined){last='同じ通知IDの保存データがあるため、上書きしていません。';show();return false;}
 store({id:report.id,report,endpoint:cfg.endpoint,recipient:cfg.recipient,status:'pending',tries:0,nextAttempt:0});

}
function exportPending(){const pending=jobs().filter(j=>j.report).map(j=>({id:j.id,status:j.status,error:j.error||null,report:j.report}));const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,pending},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='yuika-pending-notifications.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function endpoint(value){const u=new URL(value);if(u.protocol!=='https:'||!u.hostname.endsWith('.workers.dev')||u.username||u.password||u.port||u.search||u.hash||u.pathname!=='/')throw Error('設定したCloudflare Workerの https://〜.workers.dev のURLを入力してください。');return u.origin;}
function mount(){
 const wrap=document.createElement('section');wrap.style.cssText='max-width:944px;margin:20px auto;padding:16px;font:13px/1.7 system-ui;color:#394d43';
 wrap.innerHTML='<p id="yuika-mail-status" role="status" aria-live="polite"></p><details><summary style="cursor:pointer">保護者：チャレンジ結果の自動メール</summary><p>接続すると、チャレンジ終了時に、今回の正誤・回答・ヒント等を登録した保護者へ送ります。自由記述は送信しません。以前の単元で記録していない項目は補いません。過去の履歴の一括送信はしません。</p><p>iPadでアプリを閉じている間は再送できません。未送信分は、次に開いたときに再試行します。通知を停止しても学習記録は消しません。</p><form id="yuika-mail-form"><label style="display:block">送信サーバーURL<input id="yuika-mail-url" type="url" required placeholder="https://〜.workers.dev" style="display:block;width:100%;box-sizing:border-box;padding:10px"></label><label style="display:block">この端末の接続キー<input id="yuika-mail-token" type="password" required minlength="32" autocomplete="off" style="display:block;width:100%;box-sizing:border-box;padding:10px"></label><p>メールサービスのAPIキーはここに入れません。接続キーは公開サイトやGitHubに書き込まず、この端末だけに保存します。</p><button type="submit" style="padding:10px;min-height:44px">接続を確認して有効にする</button> <button id="yuika-mail-stop" type="button" style="padding:10px;min-height:44px">自動メールを停止</button> <button id="yuika-mail-retry" type="button" style="padding:10px;min-height:44px">保留分を確認・再試行</button> <button id="yuika-mail-export" type="button" style="padding:10px;min-height:44px">保留通知をJSONで保全</button></form></details>';
 document.body.append(wrap);
 const cfg=config();if(cfg?.endpoint)document.getElementById('yuika-mail-url').value=cfg.endpoint;
 document.getElementById('yuika-mail-form').onsubmit=async e=>{e.preventDefault();if(window.YuikaParent.suppress())return;const button=e.submitter;if(button)button.disabled=true;try{
  const base=endpoint(document.getElementById('yuika-mail-url').value.trim()),token=document.getElementById('yuika-mail-token').value.trim();if(token.length<32)throw Error('接続キーを確認してください。');
  const r=await fetch(base+'/health',{headers:{Authorization:'Bearer '+token},credentials:'omit',signal:AbortSignal.timeout(15000)}),body=await r.json();
  if(!r.ok||body.ready!==true||typeof body.recipient!=='string')throw Error('送信サーバーの設定・接続キーを確認してください。');
  if(!confirm('送信先：'+body.recipient+'\n今後のチャレンジ結果をこの宛先へ自動送信します。接続しますか？'))return;
  window.YuikaParent.storage.setItem(CONFIG,JSON.stringify({enabled:true,endpoint:base,token,recipient:body.recipient}));document.getElementById('yuika-mail-token').value='';last='自動メールを有効にしました。次のチャレンジから通知します。';show();void flush();
 }catch(err){last='接続できませんでした。'+err.message;show();}finally{if(button)button.disabled=false;}};
 document.getElementById('yuika-mail-stop').onclick=()=>{try{const c=config();if(c)window.YuikaParent.storage.setItem(CONFIG,JSON.stringify({...c,enabled:false}));last='今後の自動送信を停止しました。送信処理が始まっている通知は取り消せません。';}catch{last='停止設定を保存できません。通信を切って、この画面を閉じてください。';}show();};
 document.getElementById('yuika-mail-retry').onclick=()=>{last='';show();void flush();};document.getElementById('yuika-mail-export').onclick=exportPending;
 show();void flush();
}
window.YuikaReports={enqueue,id};
window.addEventListener('online',()=>void flush());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)void flush();});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();
})();

</script>

    "explanation": "時速14.4kmは秒速4m、時速21.6kmは秒速6m。 差は毎秒6－4＝2mずつ縮む。 144÷2＝72秒。",
    "pitfall": "距離がmで時間が秒なら、使う速さは秒速mだよ。",
    "answerUnit": "秒",
    "wrongValues": {
      "20": "単位未換算",
      "14.4": "和と差の取り違え"
    }
  },
  {
    "id": "passage-24",
    "step": 4,
    "type": "number",
    "prompt": "午前10時14分にランナーAが時速7.2kmで出発し、午前10時22分にランナーBが同じ地点から同じ方向に時速9.6kmで出発しました。BがAに追いつくのは午前10時何分ですか？",
    "answer": 46,
    "hint": "Bが出発した時の2人の差を、分速mを使って求めよう。",
    "steps": [
      "Aは分速120m、Bは分速160m。",
      "Bが出発するときAは8分先に出ているので、120×8＝960m先。",
      "960÷(160－120)＝24分。午前10時22分の24分後は午前10時46分。"
    ],
    "explanation": "Aは分速120m、Bは分速160m。 Bが出発するときAは8分先に出ているので、120×8＝960m先。 960÷(160－120)＝24分。午前10時22分の24分後は午前10時46分。",
    "pitfall": "追いつく時刻を聞かれたら、かかった時間をBの出発時刻に足そう。",
    "answerUnit": "分",
    "wrongValues": {
      "422": "単位未換算",
      "38": "先に出た人の時刻に足した",
      "24": "経過時間を時刻と取り違えた"
    }
  }
]
</script>
<script>
'use strict';
const UNIT = '通過算・旅人算　進む長さをつかむ';
const STAGES = ['何m進むか', '速さの和か差か', '単位をそろえる', '通過算を通しで解く', '旅人算'];
const QUESTIONS = JSON.parse(document.getElementById('questions').textContent);
const main = document.getElementById('main');
const back = document.getElementById('back');
const esc = value => String(value).replace(/[&<>"']/g, char => (
  {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[char]
));
let run = null;

function button(id, action) {
  document.getElementById(id).onclick = action;
}

function focusMain() {
  main.focus();
  window.scrollTo(0, 0);
}

function home() {
  run = null;
  main.innerHTML = `<section class="unit-hero card"><h1>${UNIT}</h1>
    <p>進む長さ、速さ、単位を順に練習して、通過算と旅人算を解こう。</p></section>
    <section class="card"><h2>段階を選ぶ</h2><div class="stage-list">
    ${STAGES.map((label, step) => `<button data-stage="${step}">S${step + 1}　${label}（${QUESTIONS.filter(q => q.step === step).length}問）</button>`).join('')}
    </div></section>`;
  main.querySelectorAll('[data-stage]').forEach(control => {
    control.onclick = () => start(Number(control.dataset.stage));
  });
  focusMain();
}

function start(step) {
  run = {step, id: window.YuikaReports.id(), questions: QUESTIONS.filter(q => q.step === step), answers: [], finished: false};
  quiz();
}

function stageLabel() {
  return `S${run.step + 1} ${STAGES[run.step]}`;
}

function quiz() {
  const q = run.questions[run.answers.length];
  const numeric = q.type === 'number';
  let selection = null;
  let hintUsed = false;
  const index = run.answers.length;
  main.innerHTML = `<section class="quiz card">
    <p class="muted">${stageLabel()} · ${index + 1} / ${run.questions.length}問</p>
    <h1 class="question">${esc(q.prompt)}</h1>
    ${numeric ? `<label for="numeric">答え（数字だけ）</label>
      <div><input id="numeric" inputmode="decimal" autocomplete="off" maxlength="60" aria-describedby="answer-unit"> <b id="answer-unit">${esc(q.answerUnit)}</b></div>`
      : `<div class="choices">${q.options.map((option, i) => `<button class="option" data-choice="${i}" aria-pressed="false">${esc(option)}</button>`).join('')}</div>`}
    <div id="error" role="alert"></div>
    <div class="actions"><button class="primary" id="check">答え合わせ</button><button id="hint">ヒントを見る</button></div>
    <p id="hintbox" class="note" hidden></p>
    <div id="feedback" aria-live="polite"></div>
    <div class="actions"><button id="end">今日はここまで</button></div>
    </section>`;

  const input = document.getElementById('numeric');
  const check = document.getElementById('check');
  const choices = main.querySelectorAll('[data-choice]');
  choices.forEach(control => {
    control.onclick = () => {
      selection = q.options[Number(control.dataset.choice)];
      choices.forEach(choice => choice.setAttribute('aria-pressed', choice === control));
    };
  });
  button('hint', () => {
    hintUsed = true;
    const hint = document.getElementById('hintbox');
    hint.textContent = q.hint;
    hint.hidden = false;
    document.getElementById('hint').disabled = true;
  });
  button('check', () => {
    if (check.disabled) return;
    // Match the science engine's decimal input convention, including full-width digits.
    const raw = numeric ? input.value.normalize('NFKC').trim() : selection;
    const value = numeric && /^(?:\d+(?:\.\d*)?|\.\d+)$/.test(raw) ? Number(raw) : raw;
    if (numeric ? typeof value !== 'number' || !Number.isFinite(value) : value === null) {
      document.getElementById('error').textContent = numeric ? '0以上の数字を入力してね。' : '答えをひとつ選んでね。';
      return;
    }
    document.getElementById('error').textContent = '';
    const correct = value === q.answer;
    const tag = correct ? '' : numeric ? q.wrongValues[value] ?? '計算・立式を見直す' : q.optionTags[value];
    const unit = q.answerUnit || '';
    const decimalHint = numeric && unit === 'm' && !Number.isInteger(value)
      ? '長さが小数になったら見直そう。' : '';
    const explanation = [q.explanation, !correct && q.pitfall, tag && `誤答タグ：${tag}`, decimalHint].filter(Boolean).join(' ');
    run.answers.push({question: q.prompt, response: value + unit, expected: q.answer + unit,
      explanation, correct, hint: hintUsed, mode: stageLabel()});
    main.querySelectorAll('[data-choice],#numeric,#hint,#check').forEach(control => control.disabled = true);
    const complete = run.answers.length === run.questions.length;
    if (complete) report(false);
    document.getElementById('feedback').innerHTML = `<div class="note">
      <h2>${correct ? 'できたね！' : '考え方を確認しよう'}</h2>
      <p>あなたの答え：<b>${esc(value)}${unit}</b><br>正しい答え：<b>${esc(q.answer)}${unit}</b></p>
      <ol>${q.steps.map(step => `<li>${esc(step)}</li>`).join('')}</ol>
      ${correct ? '' : `<p>${esc(q.pitfall)} ${esc(decimalHint)}</p><p>誤答タグ：${esc(tag)}</p>`}
      </div><button class="primary" id="next">${complete ? '今回のふりかえり' : '次の問題へ'}</button>`;
    button('next', complete ? result : quiz);
    document.getElementById('next').focus();
  });
  if (input) input.onkeydown = event => {
    if (event.key === 'Enter' && !event.isComposing) check.click();
  };
  button('end', () => {
    if (run.answers.length) result();
    else home();
  });
  focusMain();
}

function report(partial) {
  if (run.finished) return;
  run.finished = true;
  if (window.YuikaParent.suppress()) return;
  const answers = run.answers;
  window.YuikaReports.enqueue({
    version: 1, id: 'math-passage:' + run.id, app: 'legacy', subject: '算数', unit: UNIT,
    mode: stageLabel() + (partial ? '（途中終了）' : ''), completedAt: new Date().toISOString(),
    total: answers.length, correct: answers.filter(a => a.correct).length, detail: 'full', answers
  });
}

function result() {
  const partial = run.answers.length < run.questions.length;
  report(partial);
  main.innerHTML = `<section class="card"><h1>今回のふりかえり</h1>
    <p>${stageLabel()}${partial ? '（途中終了）' : ''}</p>
    <p><strong>${run.answers.filter(a => a.correct).length} / ${run.answers.length}問 正解</strong></p>
    <div class="actions"><button id="return">段階を選ぶ</button>
    ${!partial && run.step + 1 < STAGES.length ? '<button class="primary" id="next-stage">次の段階へ</button>' : ''}</div></section>`;
  button('return', home);
  if (document.getElementById('next-stage')) button('next-stage', () => start(run.step + 1));
  focusMain();
}

button('back', () => {
  if (run && !run.finished && run.answers.length) {
    result();
    return;
  }
  window.YuikaParent.navigate('index.html');
});
back.insertAdjacentHTML('afterbegin', window.YuikaDesign.icon('back'));
home();
</script>
</body>
</html>
