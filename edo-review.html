function weaknesses(events=data.events,now=Date.now(),includeRecovered=false){
 const groups=new Map(),seen=new Set();
 for(const e of order(events)){
  if(seen.has(e.id))continue;seen.add(e.id);
  const q=Q.get(e.questionId),age=now-Date.parse(e.at);
  if(!q||age<0||age>30*86400000)continue;
  const id=q.originId||q.id,key=id+':'+e.variant;
  if(!groups.has(key))groups.set(key,[]);groups.get(key).push(e);
 }
 const rows=[];
 for(const [key,all] of groups){
  // One observation per Japan day; retain hints/errors from earlier retries.
  const days=new Map();
  for(const e of all){
   const key=japanDay(e.at),previous=days.get(key);
   days.set(key,{last:e,wrong:!e.correct||!!previous?.wrong,hint:e.hint||!!previous?.hint});
  }
  const samples=[...days.values()].slice(-5),last=samples.at(-1).last;
  // A hinted success cannot undo an earlier unassisted success by itself.
  let recovered=false;
  for(const e of all){if(!e.correct)recovered=false;else if(!e.hint)recovered=true;}
  const wrong=samples.filter(d=>!d.last.correct||((d.last.hint||(includeRecovered&&recovered))&&d.wrong)).length;
  if(samples.length<2||wrong<2||(!includeRecovered&&recovered))continue;
  const q=Q.get(last.questionId),origin=Q.get(q.originId||q.id);
  const confusion=QUESTIONS.filter(o=>o.id!==origin.id&&o.pair&&o.pair===origin.pair)
   .some(o=>grade(o,last.response,last.variant));
  rows.push({originId:origin.id,unit:origin.unit,variant:last.variant,wrong,total:samples.length,
   recovered,lastHint:last.hint,lastCorrect:last.correct,level:origin.level||({memory:1,pairs:2,flow:2,reason:3}[origin.course]||1),hintCount:samples.filter(d=>d.hint).length,lastAt:last.at,confusion});
 }
 return rows.sort((a,b)=>b.wrong/b.total-a.wrong/a.total||b.lastAt.localeCompare(a.lastAt)||a.originId.localeCompare(b.originId)||a.variant.localeCompare(b.variant));
}
// A device clock is not a trusted time source. Do not reinterpret future-dated
// history as a recovered/empty weakness set after the clock moves backwards.
function practiceClockIssue(events=data.events,now=Date.now()){
 return events.some(e=>Date.parse(e.at)>now+5*60000);
}
function practiceUnavailable(events=data.events,now=Date.now()){return blocked||dirty||practiceClockIssue(events,now);}
const PRACTICE_CLOCK_NOTICE='今より5分以上先の回答記録があります。端末の日付と時刻を確認してください。弱点の判定と今日の5問はお休みします。記録の時刻は自動で直しません。';
function retention(events=data.events,now=Date.now()){
 const states=new Map(),histories=new Map(),seen=new Set();
 for(const e of order(events)){
  if(seen.has(e.id)||Date.parse(e.at)>now)continue;seen.add(e.id);
  const q=Q.get(e.questionId);if(!q)continue;
  const originId=q.originId||q.id,key=originId+':'+e.variant;
  let s=states.get(key);
  if(!s&&q.type==='recall'&&!e.correct){s={originId,variant:e.variant,status:'weak',stage:0,due:null,anchor:null};states.set(key,s);}
  if(!s){
   // A new weakness requires errors on two Japan days. Success cannot add an
   // error day; examine the existing rule only when an error can change it.
   // Keep its rolling window small instead of replaying a growing full history
   // for every success (quadratic on long, previously correct-only histories).
   if(!histories.has(key))histories.set(key,{events:[],start:0,wrongDays:new Map()});
   const history=histories.get(key),stamp=Date.parse(e.at),cutoff=stamp-30*86400000;
   history.events.push(e);
   while(Date.parse(history.events[history.start].at)<cutoff)history.start++;
   if(e.correct)continue;
   history.wrongDays.set(japanDay(e.at),stamp);
   for(const [d,t] of history.wrongDays)if(t<cutoff)history.wrongDays.delete(d);
   if(history.wrongDays.size<2||!weaknesses(history.events.slice(history.start),stamp).length)continue;
   s={originId,variant:e.variant,status:'weak',stage:0,due:null,anchor:null};states.set(key,s);histories.delete(key);
  }
  const date=japanDay(e.at);
  if(!e.correct){s.status='weak';s.stage=0;s.due=null;s.anchor=null;}
  else if(!e.hint){
   if(s.status==='weak'){
    s.status='waiting';s.stage=0;s.anchor=date;s.due=addJapanDays(date,REVIEW_INTERVAL_DAYS[0]);
   }else if(s.status==='waiting'&&date>=s.due){
    s.stage++;
    if(s.stage===REVIEW_INTERVAL_DAYS.length){s.status='retained';s.due=null;}
    else s.due=addJapanDays(date,REVIEW_INTERVAL_DAYS[s.stage]-REVIEW_INTERVAL_DAYS[s.stage-1]);
   }
  }
 }
 return [...states.values()];
}
function practiceWeaknesses(events=data.events,now=Date.now()){
 if(practiceUnavailable(events,now))return [];
 const rows=weaknesses(events,now),keys=new Set(rows.map(r=>r.originId+':'+r.variant));
 for(const s of retention(events,now).filter(s=>s.status==='weak')){
  if(keys.has(s.originId+':'+s.variant))continue;
  const q=Q.get(s.originId),es=order(events).filter(e=>(Q.get(e.questionId)?.originId||e.questionId)===s.originId&&e.variant===s.variant&&Date.parse(e.at)<=now),last=es.at(-1);
  rows.push({...s,unit:q.unit,level:q.level||({memory:1,pairs:2,flow:2,reason:3}[q.course]||1),wrong:1,total:1,hintCount:0,lastAt:last.at,lastCorrect:last.correct,lastHint:last.hint});
 }
 return rows;
}

if(prototypeScience){analysis=function(){prototypeParent();main.insertAdjacentHTML('afterbegin',prototypeNotice());};}
else{parent=function(){prototypeParent();main.insertAdjacentHTML('afterbegin',prototypeNotice());};}
const prototypeRecords=records;
records=function(){
 prototypeRecords();main.insertAdjacentHTML('afterbegin',prototypeNotice());
 main.insertAdjacentHTML('beforeend',`<section class="card"><h2>元データをそのまま保管</h2><p>読み取れない・旧版で開けない記録も変換しません。合成データだけを明示的に取り込んで試してください。</p><button id="prototype-original">元の回答データを保存</button>${rejectedImportRaw!==null?'<button id="prototype-rejected">取り込めなかったファイルを保存</button>':''}</section>`);
 document.getElementById('prototype-original').onclick=()=>{
  try{const raw=window.YuikaParent.storage.getItem(LEGACY_KEY);prototypeCheck(raw!==null,'元の回答データはこの場所にありません。');download('yuika-original-unchanged.json',raw);}
  catch(e){(prototypeScience?message:note)(e.message);}
 };
 if(rejectedImportRaw!==null)document.getElementById('prototype-rejected').onclick=()=>download('yuika-rejected-original.json',rejectedImportRaw);
};
importFile=async function(file){
 if(!file)return;
 let raw=null;
 try{
  prototypeCheck(file.size<=(prototypeScience?10000000:25000000),'JSONのサイズが上限を超えています。');
  raw=await file.text();const value=JSON.parse(raw),v=prototypeUnpack(value);let incoming;
  if(prototypeScience&&v&&Object.hasOwn(v,'attempts')&&!Object.hasOwn(value,'format')){
   // Explicit legacy aggregate import only; never infer individual responses.
   prototypeFields(v,['attempts','correct','wrong']);legacyData(raw);incoming=emptyState();incoming.legacy=[{raw,capturedAt:new Date().toISOString()}];
  }else incoming=prototypeScience?validateState(v):validate(v);
  prototypeCheck(!blocked,'試作の保存済み記録が読み取れません。先に元データを保管してください。');
  const diskRaw=window.YuikaParent.storage.getItem(KEY),disk=diskRaw!==null?(prototypeScience?validateState(JSON.parse(diskRaw)):validate(JSON.parse(diskRaw))):(prototypeScience?emptyState():empty());
  const next=merge(merge(disk,prototypeScience?state:data),incoming);
  // Commit only after complete validation and a successful atomic setItem.
  window.YuikaParent.storage.setItem(KEY,JSON.stringify(next));
  if(prototypeScience)state=next;else data=next;
  dirty=false;rejectedImportRaw=null;
  (prototypeScience?message:note)('試作へ読み込みました。同じ回答IDは重複させず、元の保存先は変更していません。');records();
 }catch(e){
  rejectedImportRaw=raw;(prototypeScience?message:note)('読み込みを中止しました。保存済み記録は変更していません。'+e.message);records();
 }
};
// PROTOTYPE_END
// MEDAKA_START
// Only the new recall questions use this UI. Existing grading and records stay intact.
const RECALL_LABELS={unaided:'自力で正解',assisted:'選択肢で正解',incorrect:'不正解'};
const medakaQuiz=quiz;
quiz=function(){
 const s=session,q=s.questions[s.index];
 if(q.type!=='recall'){medakaQuiz();return;}
 // Local stage resets whenever a new question is rendered; no answer words in stage 1.
 s.recallStage='first';s.firstResponse=null;s.selected=null;
 main.innerHTML=`<div class="quiz"><button class="small" id="end">← いったんおしまい</button><p>${s.index+1} / ${s.questions.length}問</p><section class="card"><span class="tag">${esc(q.unit)}</span><h1 class="question">${esc(q.prompt)}</h1><p id="recall-instruction" tabindex="-1">まず選択肢なしで答えよう。</p><div id="recall-input">${'<label class="field" for="recall-text">思い出した答えを入力</label><input id="recall-text" type="text" autocomplete="off" maxlength="100" style="width:100%">'}</div><div id="answerError" class="error" role="alert"></div><div class="actions"><button class="primary" id="check">答え合わせ</button></div><div id="feedback" aria-live="polite"></div></section></div>`;
 main.querySelectorAll('[data-fin]').forEach(b=>{
  const choose=()=>{if(s.answered||s.recallStage!=='first')return;s.selected=b.dataset.fin;main.querySelectorAll('[data-fin]').forEach(x=>{const on=x===b;x.setAttribute('aria-pressed',String(on));x.querySelector('rect').setAttribute('stroke',on?'var(--subject)':'transparent');});};
  b.onclick=choose;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose();}};
 });
 document.getElementById('check').onclick=submit;
 const input=document.getElementById('recall-text');if(input)input.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)submit();};
 document.getElementById('end').onclick=()=>navigate('home');
};
const medakaSubmit=submit;
submit=function(){
 const s=session;if(!s||s.answered)return;
 const q=s.questions[s.index];if(q.type!=='recall'){medakaSubmit();return;}
 const raw=s.recallStage==='choice'||q.diagram?s.selected:document.getElementById('recall-text').value;
 if(raw===null||!String(raw).trim()){document.getElementById('answerError').textContent=q.diagram&&s.recallStage==='first'?'ひれの位置をタップしてね。':'答えを入力するか、表示された選択肢を選んでね。';return;}
 if(s.recallStage==='first'&&!grade(q,raw)){
  s.firstResponse=raw;s.recallStage='choice';s.selected=null;
  document.getElementById('recall-instruction').textContent='もう一度、今度は選択肢から選ぼう。';
  document.getElementById('answerError').textContent='';
  document.getElementById('recall-input').innerHTML=`<p>最初の答え：${esc(raw)}</p><div class="stack">${q.options.map((o,i)=>`<button class="option" data-choice="${i}" aria-pressed="false">${esc(o)}</button>`).join('')}</div>`;
  main.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(s.answered)return;s.selected=q.options[Number(b.dataset.choice)];main.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
  document.getElementById('recall-instruction').focus();return;
 }
 const correct=grade(q,raw),recallOutcome=correct?(s.recallStage==='first'?'unaided':'assisted'):'incorrect';
 const now=new Date(),firstResponse=s.recallStage==='first'?raw:s.firstResponse;
 const e=validateEvent({questionVersion:currentQuestionVersion(q),id:uid(),sessionId:s.id,questionId:q.id,datasetVersion:VERSION,unit:q.unit,type:q.type,question:q.prompt,response:raw,inputRaw:raw,expected:q.answer,correct,answeredAt:now.toISOString(),timezoneOffset:now.getTimezoneOffset(),localDay:localDay(now.toISOString(),now.getTimezoneOffset()),hintUsed:recallOutcome!=='unaided',mode:s.mode,explanation:q.explanation,recallOutcome,firstResponse});
 s.answered=true;state.events.push(e);s.results.push(e);const saved=persist();
 main.querySelectorAll('[data-choice],#recall-text,#check').forEach(b=>b.disabled=true);
 main.querySelectorAll('[data-fin]').forEach(b=>b.setAttribute('aria-disabled','true'));
 document.getElementById('feedback').innerHTML=`<div class="answerbox ${correct?'':'again'}"><h2>${RECALL_LABELS[recallOutcome]}</h2><p>最初の答え：${esc(firstResponse)}<br>最後の答え：${esc(raw)}<br>正しい答え：<b>${esc(q.answer)}</b></p><p>${esc(q.explanation)}</p><details><summary>根拠・解説</summary><p>${esc(q.basis)}</p><small>概念ID：${esc(q.conceptId)} ／ ${esc(q.source)}</small></details><p>${recallOutcome==='unaided'?'自分で思い出せました。':'自力で答えられるまで、再確認の対象に残ります。'}</p><small>${saved?'回答を保存しました':'回答は一時保持です。JSONを書き出してください。'}</small></div><button class="primary wide" id="next">${s.index+1===s.questions.length?'今回のふりかえり →':'次の問題へ →'}</button>`;
 document.getElementById('next').onclick=()=>{s.index++;if(s.index===s.questions.length){s.done=true;result();}else{s.answered=false;s.hint=false;s.selected=null;quiz();}main.focus();window.scrollTo(0,0);};
 document.getElementById('next').focus();
};
const medakaAnalysis=analysis;
analysis=function(){medakaAnalysis();const es=state.events.filter(e=>e.type==='recall');main.insertAdjacentHTML('afterbegin',`<section class="card"><h2>江戸時代：思い出す力の記録</h2>${Object.entries(RECALL_LABELS).map(([k,label])=>`<p>${label}：${es.filter(e=>e.recallOutcome===k).length}回答</p>`).join('')}<p>選択肢での正解は自力の正解と分けています。自力で答えられるまで弱点・再確認に残り、その後は別の日にも確認します。</p></section>`);};
const medakaResult=result;
result=function(){medakaResult();if(session.results.some(e=>e.type==='recall'))main.insertAdjacentHTML('afterbegin',`<section class="card">${Object.entries(RECALL_LABELS).map(([k,label])=>`<p>${label}：${session.results.filter(e=>e.recallOutcome===k).length}問</p>`).join('')}</section>`);};
// MEDAKA_END
// DESIGN_C_START
const designHome=home;
home=function(){
 designHome();
 const latest=new Map();for(const e of [...data.events].sort((a,b)=>a.at.localeCompare(b.at)))if(Q.has(e.questionId)&&(e.variant||'normal')==='normal')latest.set(Q.get(e.questionId).originId||e.questionId,e);
 window.YuikaDesign.unitHome(main,{subject:'社会',code:'江戸時代',total:QUESTIONS.length,correct:[...latest.values()].filter(e=>e.correct).length,due:scienceDue().length,weak:practiceWeaknesses().length});
};
// DESIGN_C_END
load();render();
if(new URLSearchParams(location.search).get('daily')==='1')start('daily');
</script>
