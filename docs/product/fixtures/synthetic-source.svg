<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-labelledby="title desc">
  <title id="title">合成教材・読み取り確認用</title>
  <desc id="desc">手作りのテスト入力例。水を冷やすと氷になるという文と、方角を判読不明にした太陽の文。実教材の写真でもOCRの実行結果でもありません。</desc>
  <rect width="600" height="240" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#172d3f">
    <text x="24" y="38" font-size="18">合成教材・読み取り確認用</text>
    <text x="24" y="100" font-size="24">水を冷やすと氷になります。</text>
    <text x="24" y="160" font-size="24">太陽は［判読不明］からのぼります。</text>
    <text x="24" y="218" font-size="14">※ 手作りの仕様例です。OCRは実行していません。</text>
  </g>
</svg>
