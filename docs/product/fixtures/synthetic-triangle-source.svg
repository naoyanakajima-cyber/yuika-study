<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="triangle-title triangle-desc">
  <title id="triangle-title">合成の教材図：三角形の辺</title>
  <desc id="triangle-desc">三角形を囲む3本のまっすぐな辺に1、2、3と番号を付けています。三角形の辺は3本です。手作りの合成図で、OCRは実行していません。</desc>
  <rect width="600" height="320" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#172d3f">
    <text x="24" y="34" font-size="22">合成の教材図：三角形の辺</text>
    <path d="M 300 70 L 180 220 L 420 220 Z" fill="#e8f1f8" stroke="#172d3f" stroke-width="5" stroke-linejoin="round"/>
    <text x="214" y="142" font-size="26">1</text>
    <text x="370" y="142" font-size="26">2</text>
    <text x="292" y="211" font-size="26">3</text>
    <text x="120" y="264" font-size="28">三角形の辺は3本です。</text>
    <text x="24" y="305" font-size="18">合成の教材図・OCRは実行していません。</text>
  </g>
</svg>
