'use strict';

    "explanation": "溶媒は物質を溶かす液体です。水が溶媒の溶液を水溶液といいます。"

  {
    "id": "ys2-004",
    "unit": "水溶液と溶解",

  {

  {

  },
  {
    "id": "ys2-016",
    "unit": "溶解度の計算",
    "type": "number",

  {
    "id": "ys2-017",

  },
  {
    "id": "ys2-018",
    "unit": "溶解度の計算",
    "type": "number",
    "prompt": "60℃の水200gで作った飽和ホウ酸水を40℃に冷やした。結晶は何g？（蒸発なし）",

 const g=groups(),now=Date.now();return QUESTIONS.filter(q=>{if(unit!=='all'&&q.unit!==unit)return false;const es=g.get(q.id)||[],last=es.at(-1);if(mode==='unseen')return !last;if(mode==='wrong')return last&&!last.correct;if(mode==='spaced')return last&&now-Date.parse(last.answeredAt)>=86400000;if(mode==='hint')return last&&last.correct&&last.hintUsed;return true;});
}
function analysisData(){
 const g=groups(),first=[],immediate=[],sameDay=[],later=[],firstLaterAfterError=[];
 for(const es of g.values()){
  first.push(es[0]);
  for(let i=1;i<es.length;i++){const e=es[i],prev=es[i-1],gap=Date.parse(e.answeredAt)-Date.parse(prev.answeredAt);if(e.localDay!==prev.localDay)later.push(e);else if(gap<=1800000)immediate.push(e);else sameDay.push(e);}
  const wrong=es.findIndex(e=>!e.correct);if(wrong>=0){const retest=es.slice(wrong+1).find(e=>e.localDay!==es[wrong].localDay&&Date.parse(e.answeredAt)>Date.parse(es[wrong].answeredAt));if(retest)firstLaterAfterError.push(retest);}
 }
 return {g,first,immediate,sameDay,later,firstLaterAfterError};
}
function navigate(next){
 if(session&&!session.done&&view==='quiz'&&next!=='quiz'&&!confirm('ホームへ移ると、残りの問題はいったんおしまいになります。回答済みの記録は残ります。移動しますか？'))return;
 if(next!=='quiz')session=null;view=next;render();main.focus();window.scrollTo(0,0);
}
function navState(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===view?'page':'false'));}
function home(){
 const answered=groups().size,correct=new Set(state.events.filter(e=>e.correct).map(e=>e.questionId)).size;
 main.innerHTML=`<section class="hero"><div><div class="eyebrow">YUIKA’S SCIENCE NOTE</div><h1>「わかった！」を、<br>ひとつずつ。</h1><p>今日はどんな発見があるかな。<br>５問から、ゆっくりはじめよう。</p><span class="tag">小５ 理科</span><span class="tag">解説つき・47問</span><span class="tag">オフラインで使える</span></div><svg class="art" viewBox="0 0 210 185" aria-hidden="true"><circle cx="105" cy="96" r="82" fill="#eaf1e9"/><ellipse cx="108" cy="159" rx="68" ry="9" fill="#d7e1d5"/><path d="M79 35h50m-41 0v42l-38 64q-8 15 13 15h82q20 0 12-15l-38-64V35" fill="#fffefa" stroke="#386455" stroke-width="3" stroke-linejoin="round"/><path d="M72 111h65l21 34q3 10-13 10H63q-16 0-12-10z" fill="#edc6af"/><circle cx="93" cy="129" r="6" fill="#fffefa" opacity=".8"/><circle cx="121" cy="143" r="4" fill="#fffefa"/><circle cx="102" cy="99" r="4" fill="#edc6af"/><path d="m158 37 3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#bf934b"/><path d="m45 73 2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#386455"/></svg></section><div class="stats"><div class="stat"><strong>${state.events.length}</strong><span>この版の回答数</span></div><div class="stat"><strong>${correct}<small> / 47</small></strong><span>正解できた問題</span></div><div class="stat"><strong>${47-answered}</strong><span>これからの問題</span></div></div><div class="layout"><section class="card"><div class="eyebrow">TODAY’S CHALLENGE</div><h2>今日のチャレンジ</h2><p class="muted">ヒントを見てもだいじょうぶ。解説まで読んでみよう。</p><div class="field">問題の数<div class="chips"><button data-count="5" aria-pressed="${count===5}">５問</button><button data-count="10" aria-pressed="${count===10}">10問</button></div></div><label class="field">練習する単元<select id="unit"><option value="all">ぜんぶから</option>${UNITS.map(u=>`<option>${esc(u)}</option>`).join('')}</select></label><div class="actions"><button class="primary wide" id="start">チャレンジをはじめる →</button></div><p class="muted" style="margin-top:12px">同じ問題は、１回のチャレンジに１度だけ。</p></section><section class="card green-card"><div class="eyebrow">YOUR NEXT STEP</div><h2>自分のペースで復習</h2>${[['unseen','まだ出会っていない問題','新しい47問の未回答から'],['wrong','もう一度やってみよう','最後の回答がちがった問題'],['spaced','日をあけて思い出そう','最後の回答から24時間以上'],['hint','ヒントなしでできるかな','最後はヒントを見て正解']].map(([m,t,s])=>`<button class="review" data-mode="${m}" ${candidates(m).length?'':'disabled'}><span>${t}<small>${s}</small></span><b>${candidates(m).length}<small>問</small></b></button>`).join('')}</section></div><div class="note">記録はこのブラウザーに保存されます。ときどき「記録の引きつぎ」からJSONを保存しておくと安心です。${state.legacy.length?' 以前の記録は、保護者のノートに別枠で保管しています。':''}</div><details class="source"><summary>この問題集について</summary><p>いただいた理科のまとめをもとに作成したオリジナル47問です。SAPIX公式の問題・教材ではありません。旧HTMLの47問とは問題IDが異なります。</p><p>計算には丸めたホウ酸の表（3・5・9・15・24・38g）を使用します。「同じ濃さ」だけで中和の体積比は決まらないので、問題では「20mLずつでちょうど中和」と明記しています。鉄の反応生成物の色や過酸化水素水の液性など、条件に左右される説明は一律に断定していません。でんぷんの分散液も、均一な水溶液の例には使っていません。</p><p>実験の問題は知識の復習です。火や薬品の実験は、先生など大人の指導のもとで行いましょう。</p></details>`;
 main.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{const u=document.getElementById('unit').value;count=Number(b.dataset.count);home();document.getElementById('unit').value=u;});
 document.getElementById('start').onclick=()=>{const u=document.getElementById('unit').value;start(u==='all'?'normal':'unit',u);};
 main.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));
}
function start(mode,unit='all'){
 const qs=[...candidates(mode,unit)];for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]];}
 if(!qs.length){message('今はこの練習の候補がありません。ほかの練習を選んでね。');return;}
 session={id:uid(),mode,questions:qs.slice(0,count),index:0,results:[],hint:false,selected:null,answered:false,done:false};view='quiz';render();main.focus();window.scrollTo(0,0);
}
function quiz(){
 const s=session,q=s.questions[s.index];
 main.innerHTML=`<div class="quiz"><div class="row between"><button class="small" id="end">← いったんおしまい</button><span class="muted">${esc(MODES[s.mode])} · ${s.index+1} / ${s.questions.length}問</span></div><div class="progress" aria-label="進み具合"><span style="width:${s.index/s.questions.length*100}%"></span></div><section class="card"><span class="tag">${esc(q.unit)}</span><span class="muted">${q.id}</span><h1 class="question">${esc(q.prompt)}</h1>${q.type==='number'?`<div class="tablewrap"><table><caption>計算用：水100gに溶けるホウ酸の量（丸めた値）</caption><tr><th>温度 ℃</th>${[0,20,40,60,80,100].map(n=>`<td>${n}</td>`).join('')}</tr><tr><th>ホウ酸 g</th>${[3,5,9,15,24,38].map(n=>`<td>${n}</td>`).join('')}</tr></table></div><label class="field" for="numeric">答え（数字だけを入力）</label><div class="row"><input id="numeric" class="numbers" inputmode="decimal" type="text" autocomplete="off" maxlength="100" placeholder="例：1.8"><b>g</b></div>`:`<div class="stack">${q.options.map((o,i)=>`<button class="option" data-choice="${i}" aria-pressed="false"><span>${String.fromCharCode(65+i)}</span>${esc(o)}</button>`).join('')}</div>`}<div id="answerError" class="error" role="alert"></div><div class="actions"><button class="primary" id="check">答え合わせ</button><button id="hint">ヒントを見る</button></div><div id="hintbox" hidden class="note"></div><div id="feedback" aria-live="polite"></div></section></div>`;
 main.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(s.answered)return;s.selected=q.options[Number(b.dataset.choice)];main.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
 document.getElementById('hint').onclick=()=>{if(s.answered)return;s.hint=true;const box=document.getElementById('hintbox');box.hidden=false;box.textContent=q.hint;document.getElementById('hint').disabled=true;};
 document.getElementById('check').onclick=submit;
 if(q.type==='number')document.getElementById('numeric').onkeydown=e=>{if(e.key==='Enter')submit();};
 document.getElementById('end').onclick=()=>navigate('home');
}
function submit(){
 const s=session;if(!s||s.answered)return;const q=s.questions[s.index];const raw=q.type==='number'?document.getElementById('numeric').value:s.selected;const response=q.type==='number'?numeric(raw):raw;
 if(response===null){document.getElementById('answerError').textContent=q.type==='number'?'0以上の数字を入力してね。小数も使えます。':'答えをひとつ選んでね。';return;}
 s.answered=true;document.getElementById('answerError').textContent='';const now=new Date();
 const e=validateEvent({id:uid(),sessionId:s.id,questionId:q.id,datasetVersion:VERSION,unit:q.unit,type:q.type,question:q.prompt,response,inputRaw:raw,expected:q.answer,correct:grade(q,response),answeredAt:now.toISOString(),timezoneOffset:now.getTimezoneOffset(),localDay:localDay(now.toISOString(),now.getTimezoneOffset()),hintUsed:s.hint,mode:s.mode,explanation:q.explanation});
 state.events.push(e);s.results.push(e);const saved=persist();
 main.querySelectorAll('[data-choice],#numeric,#check,#hint').forEach(b=>b.disabled=true);
 document.getElementById('feedback').innerHTML=`<div class="answerbox ${e.correct?'':'again'}"><h2>${e.correct?'できたね！':'ここをいっしょに見てみよう'}</h2><p>あなたの答え：<b>${esc(response)}${q.suffix||''}</b><br>正しい答え：<b>${esc(q.answer)}${q.suffix||''}</b></p><p>${esc(q.explanation)}</p><small>${saved?'回答を保存しました':'回答は一時保持です。閉じる前にJSONを書き出してください。'}</small></div><button class="primary wide" id="next" style="margin-top:18px">${s.index+1===s.questions.length?'今回のふりかえり →':'次の問題へ →'}</button>`;
 document.getElementById('next').onclick=()=>{s.index++;if(s.index===s.questions.length){s.done=true;result();}else{s.answered=false;s.hint=false;s.selected=null;quiz();}main.focus();window.scrollTo(0,0);};
 document.getElementById('next').focus();
}
function result(){

}
function legacyHtml(){return state.legacy.length?`<section class="card"><h2>以前の記録（詳細履歴とは別）</h2><p class="muted">旧キー ${OLD_KEY} のスナップショット。新しい問題とのID対応は不明なので、正答率・未回答判定には使いません。複数のスナップショットを合計しません。</p>${state.legacy.map(l=>{const v=legacyData(l.raw);return `<div class="note">取得日時：${dateLabel(l.capturedAt)}<br>累計回答回数：<b>${v.attempts}</b> ／ 一度でも正解した問題ID：<b>${new Set(v.correct).size}</b> ／ 未解消の誤答ID：<b>${new Set(v.wrong).size}</b></div>`;}).join('')}<p class="muted">「一度でも正解した問題数 ÷ 累計回答回数」は正答率ではありません。過去の回答内容・初回正誤は復元できません。</p></section>`:'<div class="note">以前の記録はまだ取り込まれていません。HTML自体には利用者の記録は含まれません。旧記録があっても、この新しい問題集への対応は不明です。</div>';}
function analysis(){
 const a=analysisData(),es=state.events,repeated=[...a.g].filter(([,v])=>v.filter(e=>!e.correct).length>=2),unseen=candidates('unseen');
 main.innerHTML=`<div class="eyebrow">PARENT’S NOTE</div><h1>学びのようす</h1><p class="intro muted">数字は、ゆいかの次の練習を選ぶための手がかりです。回答数やヒントの有無も、いっしょに見てください。</p><div class="note">ここからの分析は、この版で記録した回答だけです。「初回」は<b>履歴記録開始後、その問題で最初に記録された回答</b>。本当の初回学習とは限りません。少ない回答で「苦手」と断定しません。</div><div class="stats"><div class="stat"><strong>${es.length}</strong><span>記録した回答数</span></div><div class="stat"><strong>${a.g.size}<small> / 47</small></strong><span>記録のある問題数</span></div><div class="stat"><strong>${new Set(es.map(e=>e.sessionId)).size}</strong><span>回答のあるセッション数</span></div></div><section class="card"><h2>単元ごとのようす</h2><p class="muted">同じ問題への再回答も１回答として集計しています。</p><div class="tablewrap"><table><thead><tr><th>単元</th><th>正答率（正解/回答）</th><th>回答した問題</th></tr></thead><tbody>${UNITS.map(u=>{const rows=es.filter(e=>e.unit===u);return `<tr><td>${u}</td><td>${rate(rows)}</td><td>${new Set(rows.map(e=>e.questionId)).size}/${QUESTIONS.filter(q=>q.unit===u).length}問</td></tr>`;}).join('')}</tbody></table></div><p class="muted" style="margin-top:12px">全回答：${rate(es)}</p></section><div class="layout"><section class="card"><h2>初めの回答・ヒント</h2><div class="listline">記録開始後の初回：<b>${rate(a.first)}</b></div><div class="listline">ヒントあり：<b>${rate(es.filter(e=>e.hintUsed))}</b></div><div class="listline">ヒントなし：<b>${rate(es.filter(e=>!e.hintUsed))}</b></div><p class="muted" style="margin-top:12px">問題や難しさが違うため、単純な比較でヒントの効果や能力を判断できません。</p></section><section class="card"><h2>時間をおいた回答</h2><div class="listline">直後の再挑戦：<b>${rate(a.immediate)}</b></div><div class="listline">同日・30分より後：<b>${rate(a.sameDay)}</b></div><div class="listline">別の日の再回答：<b>${rate(a.later)}</b></div><div class="listline">最初の誤答の後、初めて別日に答えた結果：<b>${rate(a.firstLaterAfterError)}</b></div><p class="muted" style="margin-top:12px">直後＝同じ問題の前の回答から同日・30分以内。別日＝記録時の現地日付が異なる回答（24時間以上とは限りません）。ヒントありの回答も含み、１回の成功だけで定着とは断定しません。</p></section></div><section class="card"><h2>繰り返し確認したい問題</h2><p class="muted">２回以上の誤答がある問題を表示。すでに正解した問題も履歴として残ります。</p>${repeated.length?repeated.map(([id,rows])=>`<details><summary>${esc(byId.get(id).prompt)}<br><small>誤答 ${rows.filter(e=>!e.correct).length} / ${rows.length}回答・最後は${rows.at(-1).correct?'正解':'誤答'}</small></summary>${rows.filter(e=>!e.correct).map(e=>`<div class="facts"><p>観測：${dateLabel(e.answeredAt)} ／ 選んだ・入力した答え：<b>${esc(e.inputRaw)}</b>${e.type==='number'?'g':''} ／ ヒント${e.hintUsed?'あり':'なし'}</p><p>正解：${esc(e.expected)}</p></div>`).join('')}<p>${esc(byId.get(id).explanation)}</p><p class="muted">推測：この記録だけでは、計算ミス・読み違い・概念の混同のどれかは特定できません。解き方を本人に聞いて確認してください。</p></details>`).join(''):'<p class="empty">２回以上の誤答がある問題は、まだありません。</p>'}</section><section class="card"><h2>次の練習の候補</h2><p class="muted">「未回答」は新しい47問に対して詳細履歴がないことを示します。過去に学んでいないという意味ではありません。</p>${[['unseen','新しい問題集で未回答'],['wrong','最後の回答が誤答'],['spaced','最後の回答から24時間以上'],['hint','最後はヒントありで正解']].map(([m,t])=>`<details><summary>${t} · ${candidates(m).length}問</summary>${candidates(m).map(q=>`<p class="listline">${q.id} · ${esc(q.prompt)}</p>`).join('')||'<p>今は候補がありません。</p>'}${candidates(m).length?`<button data-practice="${m}">この候補から${count}問まで練習</button>`:''}</details>`).join('')}</section><section class="card"><h2>１回答ずつの記録</h2><p class="muted">実際の回答と正解、解説を確認できます。表示日時は現在の端末の時刻帯、回答日は記録時の現地日付です。</p><div id="history"></div></section>${legacyHtml()}<div class="note">自動の原因診断は行いません。回答時間は収集せず、能力や集中力の判定もしません。記録は自己学習の観測であり、評価や診断ではありません。</div><div class="actions"><button class="primary" id="report">分析用テキストを書き出す</button><button id="print">印刷・PDF</button></div>`;
 main.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>start(b.dataset.practice));document.getElementById('report').onclick=exportReport;document.getElementById('print').onclick=()=>window.print();history();
}
function history(){
 const es=sorted(state.events).reverse(),pages=Math.max(1,Math.ceil(es.length/20));historyPage=Math.min(historyPage,pages-1);
 document.getElementById('history').innerHTML=es.slice(historyPage*20,historyPage*20+20).map(e=>`<details><summary><span class="badge">${e.correct?'正解':'もう一度'}</span> ${esc(e.question)}<br><small>${dateLabel(e.answeredAt)} · ${esc(e.unit)}</small></summary><div class="facts"><p>観測した回答：<b>${esc(e.inputRaw)}</b>${e.type==='number'?'g':''}</p><p>正解：${esc(e.expected)}${e.type==='number'?'g':''}</p><p>ヒント${e.hintUsed?'あり':'なし'} ／ ${esc(MODES[e.mode])} ／ 回答日 ${e.localDay}</p><p>${esc(e.explanation)}</p></div><small class="overflow">問題 ${e.questionId} ／ セッション ${e.sessionId}<br>問題データ版 ${e.datasetVersion}</small></details>`).join('')||'<p class="empty">回答すると、ここに記録が増えていきます。</p>';
 if(es.length>20){const p=document.createElement('div');p.className='pages';p.innerHTML=`<button id="prevPage" ${historyPage===0?'disabled':''}>前へ</button><span>${historyPage+1} / ${pages}</span><button id="nextPage" ${historyPage+1===pages?'disabled':''}>次へ</button>`;document.getElementById('history').append(p);document.getElementById('prevPage').onclick=()=>{historyPage--;history();};document.getElementById('nextPage').onclick=()=>{historyPage++;history();};}
}
function download(name,content,type='application/json'){
 const url=URL.createObjectURL(new Blob([content],{type:type+';charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function exportRecords(){download('yuika-records-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2));}
function exportReport(){
 const a=analysisData(),es=state.events;
 const lines=['ゆいかの理科学習ノート：保護者用レポート','出力日時：'+dateLabel(new Date().toISOString()),'問題データ版：'+VERSION,'集計対象：この版の詳細履歴 '+es.length+'回答。過去の回答内容・本当の初回は不明。','正答率の分母は回答数。同じ問題への再回答を含む。','',...UNITS.map(u=>u+'：'+rate(es.filter(e=>e.unit===u))),'全回答：'+rate(es),'記録開始後の初回：'+rate(a.first),'ヒントあり：'+rate(es.filter(e=>e.hintUsed)),'ヒントなし：'+rate(es.filter(e=>!e.hintUsed)),'直後（同日30分以内）：'+rate(a.immediate),'同日30分より後：'+rate(a.sameDay),'別日の再回答：'+rate(a.later),'最初の誤答後、最初の別日回答：'+rate(a.firstLaterAfterError),'別日は記録時の現地日付で判定。24時間以上とは限らず、ヒントありも含む。','少数回答で苦手・定着とは断定しません。ヒントあり/なしは問題構成が違うため単純比較できません。','',...['unseen','wrong','spaced','hint'].map(m=>MODES[m]+'の候補：'+candidates(m).map(q=>q.id+' '+q.prompt).join(' / ')),'','２回以上誤答した問題：',...[...a.g].filter(([,rows])=>rows.filter(e=>!e.correct).length>=2).map(([id,rows])=>`${id} ${byId.get(id).prompt}：誤答${rows.filter(e=>!e.correct).length}/${rows.length}回答、最後は${rows.at(-1).correct?'正解':'誤答'}`),'','以前の集計（別枠・足し合わせない）：',...state.legacy.map(l=>{const v=legacyData(l.raw);return `取得 ${dateLabel(l.capturedAt)}：累計回答${v.attempts}、一度でも正解したID${new Set(v.correct).size}、未解消の誤答ID${new Set(v.wrong).size}。ID対応は不明。`; }),'一度でも正解した問題数÷累計回答回数は正答率ではありません。','','１回答ごとの観測：',...sorted(es).map(e=>`${e.answeredAt}（回答日 ${e.localDay} / UTCオフセット分 ${-e.timezoneOffset}）\n${e.questionId} / ${e.unit} / ${MODES[e.mode]} / セッション ${e.sessionId}\n${e.question}\n回答：${e.inputRaw} / 正解：${e.expected} / ${e.correct?'正解':'誤答'} / ヒント${e.hintUsed?'あり':'なし'}\n解説：${e.explanation}\n`),'解釈の注意：誤答だけから計算ミス・概念の混同などの原因は特定できません。解き方を本人に確認してください。回答時間は記録・評価しません。',dirty?'注意：ブラウザーに未保存の回答を含みます。JSONでも保全してください。':''];
 download('yuika-analysis-'+new Date().toISOString().slice(0,10)+'.txt',lines.join('\n'),'text/plain');
}
async function importFile(file){
 if(!file)return;
 try{
  requireThat(file.size<=10000000,'10MBまでのJSONを選んでください。');const text=await file.text(),v=JSON.parse(text);let incoming;
  if(v&&Object.hasOwn(v,'attempts')&&Object.hasOwn(v,'correct')&&Object.hasOwn(v,'wrong')){legacyData(text);incoming=emptyState();incoming.legacy=[{raw:text,capturedAt:new Date().toISOString()}];}else incoming=validateState(v);
  const next=merge(state,incoming),added=next.events.length-state.events.length,oldAdded=next.legacy.length-state.legacy.length;
  state=next;const saved=persist();message(`読み込み：新しい回答 ${added}件、旧集計 ${oldAdded}件。重複は追加していません。${saved?'ブラウザーに保存しました。':'ブラウザーには未保存です。閉じる前にJSONを書き出してください。'}`);records();
 }catch(e){message('読み込みを中止しました。既存記録は変更していません。'+e.message);}
}
function records(){
 main.innerHTML=`<div class="eyebrow">KEEP YOUR DISCOVERIES</div><h1>記録の引きつぎ</h1><p class="intro muted">ブラウザーやファイルを変える前に、記録を手元に残しましょう。JSONが記録のバックアップ、テキストが保護者向けの分析資料です。</p><div class="note">現在：${state.events.length}回答、旧集計${state.legacy.length}件。${dirty||blocked?'<b class="error">一時保持の記録があります。閉じる前にJSONを保存してください。</b>':'ブラウザー内に保存しています。'}<br>保存キー：${KEY} ／ 旧キー ${OLD_KEY} は書き換えません。</div><div class="layout"><section class="card"><h2>記録をファイルに残す</h2><p class="muted">全回答と保管した旧集計を含みます。ファイルはご自身で保管・受け渡ししてください。</p><div class="stack"><button class="primary" id="export">JSONを書き出す</button><button id="textReport">分析用テキストを書き出す</button><button id="retry">ブラウザーへの保存を再試行</button></div></section><section class="card"><h2>記録を読み込む</h2><p class="muted">このアプリのJSON、または旧アプリの集計JSONを選びます。今ある記録に追加し、同じ回答IDは重複させません。同じIDで内容が違う場合は、全体の読み込みを中止します。</p><label class="field">JSONファイル<input id="import" type="file" accept=".json,application/json"></label><small>形式・問題版・日時・回答内容・正誤を検証します。別の問題版は取り込まず、元ファイルを保管するよう案内します。</small></section></div><section class="card"><h2>元アプリの記録を守る手順</h2><ol><li>まず、実際に使っているブラウザー・同じ場所の<b>元HTML</b>を開きます。新しいHTMLを開いただけでは、元の記録が見えないことがあります。</li><li>元HTMLを別名コピーしてバックアップします。ただし<b>HTMLのコピーだけでは学習記録は保存されません</b>。</li><li>元アプリに書き出し機能があれば、その機能でJSONを保存します。なければ、同封の「記録の引きつぎ手順.md」にある短いコードを、元アプリの開発者ツールのコンソールで実行します。旧キーを読むだけで、削除・変更はしません。</li><li>書き出したJSONをこの画面で読み込み、以前の集計を確認します。新しい問題への対応は不明なので、別枠で保管します。</li><li>このアプリのJSONも書き出して保管します。スマートフォンで元記録の書き出しができないときは、元アプリとブラウザーをそのまま残してください。別の端末で同じHTMLを開いても、記録は移りません。</li></ol><p class="muted">file:// の保存領域はブラウザー依存です。ファイルの名前・場所・ブラウザー・端末・プライベートモードによって引き継がれない可能性があります。端末の時刻や時刻帯が違う場合、別日判定にも影響します。</p><button id="rawOld">この場所で見える旧キーをそのまま保存</button>${rawBroken!==null?'<button id="rawBroken">読み取れなかった新キーの元データを保存</button>':''}<div class="note">自動送信・広告・外部ライブラリーはありません。記録ファイルには回答日時などが入るため、共有する相手を確認してください。</div></section>${legacyHtml()}`;
 document.getElementById('export').onclick=exportRecords;document.getElementById('textReport').onclick=exportReport;
 document.getElementById('import').onchange=e=>importFile(e.target.files[0]);
 document.getElementById('retry').onclick=()=>{if(persist())message('ブラウザーへの保存ができました。');records();};
 document.getElementById('rawOld').onclick=()=>{try{const raw=localStorage.getItem(OLD_KEY);if(raw===null){message('この場所からは旧キーが見つかりません。実際に使っていた元アプリで書き出してください。');return;}download('yuika-science-v1-original.json',raw);}catch(e){message('旧キーを読み取れませんでした。元アプリのブラウザーを残してください。');}};
 if(rawBroken!==null)document.getElementById('rawBroken').onclick=()=>download('yuika-v2-unreadable-original.json',rawBroken);
}
function render(){navState();if(view==='home')home();else if(view==='analysis')analysis();else if(view==='records')records();else if(view==='quiz'){if(session.done)result();else quiz();}}
// 別タブの通常の変更を統合。厳密に同時の書き込みはlocalStorageではトランザクション化できないため、学習は１タブで行う。
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{state=merge(state,validateState(JSON.parse(e.newValue)));if(view!=='quiz')render();}catch(err){message('別タブの記録と競合しました。自動で上書きせず、JSONを書き出して保全してください。');}}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));
load();render();
</script>
</body>
</html>
