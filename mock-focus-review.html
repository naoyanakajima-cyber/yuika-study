 active=true;temporary=true;

function targetURL(target){const next=new URL(target,location.href);if(temporary&&next.origin===location.origin)next.searchParams.set('parent-check','1');return next.href;}

 setItem(k,v){if(temporary)memory.set(k,String(v));else if(active)sessionStorage.setItem(PREFIX+k,String(v));else window.localStorage.setItem(k,v);},
 removeItem(k){if(temporary)memory.delete(k);else if(active)sessionStorage.removeItem(PREFIX+k);else window.localStorage.removeItem(k);},

 get length(){return temporary?memory.size:active?Object.keys(sessionStorage).filter(k=>k.startsWith(PREFIX)).length:window.localStorage.length;}
};
const temporaryNotice='一時保存が使えないため安全な確認モードで開きました。回答はこの画面だけに保持し、再読込・移動で失われます。子どもの記録と通知には触れません。';

function plan(since){
 const cutoff=new Date(since).getTime();if(!Number.isFinite(cutoff))throw Error('日時を指定してください。');

 else if(v&&typeof v==='object'){
  if(key==='yuika_cleared'){for(const [k,e] of Object.entries(v))if(recent(e)){delete v[k];removed++;}}

function remove(plan){

 for(const c of plan.changes)if(window.localStorage.getItem(c.key)!==c.raw)throw Error('記録が更新されました。件数を確認し直してください。');

   if(window.localStorage.getItem(c.key)!==c.next){restored=false;continue;}

  }catch{restored=false;}

 document.body.prepend(banner);document.getElementById('parent-exit').onclick=exit;

 document.getElementById('parent-count').onclick=()=>{if(incomplete){result.textContent='復元未確認の記録があります。先に削除前のJSONを保全し、この画面で追加の削除をしないでください。';return;}try{pending=plan(document.getElementById('parent-since').value);result.textContent=`削除対象：${pending.count}件`;button.disabled=!pending.count;}catch(e){pending=null;button.disabled=true;result.textContent=e.message;}};

function weaknesses(events=data.events,now=Date.now(),includeRecovered=false){
 const groups=new Map(),seen=new Set();
 for(const e of order(events)){
  if(seen.has(e.id))continue;seen.add(e.id);
  const q=Q.get(e.questionId),age=now-Date.parse(e.at);
  if(!q||age<0||age>30*86400000)continue;
  const id=q.originId||q.id,key=id+':'+e.variant;
  if(!groups.has(key))groups.set(key,[]);groups.get(key).push(e);
 }
 const rows=[];
 for(const [key,all] of groups){
  // One observation per Japan day; retain hints/errors from earlier retries.
  const days=new Map();
  for(const e of all){
   const key=japanDay(e.at),previous=days.get(key);
   days.set(key,{last:e,wrong:!e.correct||!!previous?.wrong,hint:e.hint||!!previous?.hint});
  }
  const samples=[...days.values()].slice(-5),last=samples.at(-1).last;
  // A hinted success cannot undo an earlier unassisted success by itself.
  let recovered=false;
  for(const e of all){if(!e.correct)recovered=false;else if(!e.hint)recovered=true;}
  const wrong=samples.filter(d=>!d.last.correct||((d.last.hint||(includeRecovered&&recovered))&&d.wrong)).length;
  if(samples.length<2||wrong<2||(!includeRecovered&&recovered))continue;
  const q=Q.get(last.questionId),origin=Q.get(q.originId||q.id);
  const confusion=QUESTIONS.filter(o=>o.id!==origin.id&&o.pair&&o.pair===origin.pair)
   .some(o=>grade(o,last.response,last.variant));
  rows.push({originId:origin.id,unit:origin.unit,variant:last.variant,wrong,total:samples.length,
   recovered,lastHint:last.hint,lastCorrect:last.correct,level:origin.level||({memory:1,pairs:2,flow:2,reason:3}[origin.course]||1),hintCount:samples.filter(d=>d.hint).length,lastAt:last.at,confusion});
 }
 return rows.sort((a,b)=>b.wrong/b.total-a.wrong/a.total||b.lastAt.localeCompare(a.lastAt)||a.originId.localeCompare(b.originId)||a.variant.localeCompare(b.variant));
}

// Retention v1 is a deterministic projection of durable events, independent of
// the current 30-day extraction window. Replaying legacy JSON migrates without
// rewriting any event, ID, timestamp, key, or historical grade.
const REVIEW_INTERVAL_DAYS=Object.freeze([1,3,7]); // provisional, editable configuration
MODES.daily='今日の5問';
const addJapanDays=(d,n)=>new Date(Date.parse(d+'T00:00:00Z')+n*86400000).toISOString().slice(0,10);
function retention(events=data.events,now=Date.now()){
 const states=new Map(),histories=new Map(),seen=new Set();
 for(const e of order(events)){
  if(seen.has(e.id)||Date.parse(e.at)>now)continue;seen.add(e.id);
  const q=Q.get(e.questionId);if(!q)continue;
  const originId=q.originId||q.id,key=originId+':'+e.variant;
  let s=states.get(key);
  if(!s){
   // A new weakness requires errors on two Japan days. Success cannot add an
   // error day; examine the existing rule only when an error can change it.
   // Keep its rolling window small instead of replaying a growing full history
   // for every success (quadratic on long, previously correct-only histories).
   if(!histories.has(key))histories.set(key,{events:[],start:0,wrongDays:new Map()});
   const history=histories.get(key),stamp=Date.parse(e.at),cutoff=stamp-30*86400000;
   history.events.push(e);
   while(Date.parse(history.events[history.start].at)<cutoff)history.start++;
   if(e.correct)continue;
   history.wrongDays.set(japanDay(e.at),stamp);
   for(const [d,t] of history.wrongDays)if(t<cutoff)history.wrongDays.delete(d);
   if(history.wrongDays.size<2||!weaknesses(history.events.slice(history.start),stamp).length)continue;
   s={originId,variant:e.variant,status:'weak',stage:0,due:null,anchor:null};states.set(key,s);histories.delete(key);
  }
  const date=japanDay(e.at);
  if(!e.correct){s.status='weak';s.stage=0;s.due=null;s.anchor=null;}
  else if(!e.hint){
   if(s.status==='weak'){
    s.status='waiting';s.stage=0;s.anchor=date;s.due=addJapanDays(date,REVIEW_INTERVAL_DAYS[0]);
   }else if(s.status==='waiting'&&date>=s.due){
    s.stage++;
    if(s.stage===REVIEW_INTERVAL_DAYS.length){s.status='retained';s.due=null;}
    else s.due=addJapanDays(date,REVIEW_INTERVAL_DAYS[s.stage]-REVIEW_INTERVAL_DAYS[s.stage-1]);
   }
  }
 }
 return [...states.values()];
}
function practiceWeaknesses(events=data.events,now=Date.now()){
 if(practiceUnavailable(events,now))return [];
 const rows=weaknesses(events,now),keys=new Set(rows.map(r=>r.originId+':'+r.variant));
 for(const s of retention(events,now).filter(s=>s.status==='weak')){
  if(keys.has(s.originId+':'+s.variant))continue;
  const q=Q.get(s.originId),es=order(events).filter(e=>(Q.get(e.questionId)?.originId||e.questionId)===s.originId&&e.variant===s.variant&&Date.parse(e.at)<=now),last=es.at(-1);
  rows.push({...s,unit:q.unit,level:q.level||({memory:1,pairs:2,flow:2,reason:3}[q.course]||1),wrong:1,total:1,hintCount:0,lastAt:last.at,lastCorrect:last.correct,lastHint:last.hint});
 }
 return rows;
}

  .sort((a,b)=>a.due.localeCompare(b.due)||a.originId.localeCompare(b.originId)||a.variant.localeCompare(b.variant))

// Dataset versions/keys retain their existing meaning; revisions are per question.
function currentQuestionVersion(q){
 const id=q.originId||q.id;
 return QUESTION_REVISIONS[id].at(-1).revision;
}
function historicalQuestion(e){
 const science=typeof byId!=='undefined';
 const extra=!science&&e.questionId.endsWith('-review-v1');
 const id=extra?e.questionId.slice(0,-10):e.questionId;
 const records=QUESTION_REVISIONS[id]||[];
 const matches=[];
 for(const r of records){
  if(Object.hasOwn(e,'questionVersion')&&e.questionVersion!==r.revision)continue;
  const q=extra?{...r.question,id:e.questionId,originId:id,prompt:'復習：'+r.question.prompt}:r.question;
  const prompt=science?q.prompt:typeof promptOf==='function'?promptOf(q,e.variant):q.prompt;
  const expected=science?q.answer:typeof expectedOf==='function'?expectedOf(q,e.variant):q.answer;
  if(e.unit===q.unit&&(science?e.type===q.type:e.course===q.course)&&e.question===prompt&&e.expected===expected&&e.explanation===q.explanation)matches.push(q);
 }
 // Versionless histories can match multiple spelling revisions. Select the one
 // whose historical grade matches, without recalculating or rewriting the event.
 return matches.find(q=>e.correct===grade(q,e.response,e.variant));
}

 prototypeCheck(value&&typeof value==='object'&&!Array.isArray(value),'記録の形式が不正です。');
 prototypeCheck(Object.keys(value).every(k=>allowed.includes(k)),'未対応の項目があります。元ファイルを保管してください。');
}
const prototypeEventValidator=validateEvent;

 const fields=prototypeScience?
  ['questionVersion','id','sessionId','questionId','datasetVersion','unit','type','question','response','inputRaw','expected','correct','answeredAt','timezoneOffset','localDay','hintUsed','mode','explanation']:
  ['questionVersion','id','sessionId','questionId','version','unit','course','question','response','expected','explanation','correct','variant','mode','hint','at','offset','day',...(prototypeHeian?['reflection']:['unitId'])];
 prototypeFields(e,fields);
 if(prototypeHeian&&e.response&&typeof e.response==='object')prototypeFields(e.response,['steps','fills']);
 return prototypeEventValidator(e);
};
function prototypeStateFields(v){
 prototypeFields(v,['schemaVersion','datasetVersion','events','exportedAt',...(prototypeScience?['legacy']:[])]);
 if(prototypeScience&&Array.isArray(v.legacy))for(const item of v.legacy)prototypeFields(item,['raw','capturedAt']);
}

 const original=validateState;
 validateState=function(v){prototypeStateFields(v);return original(v);};
}else{

}
function prototypePacket(payload){return {format:PROTOTYPE_FORMAT,formatVersion:1,datasetVersion:VERSION,payload,exportedAt:new Date().toISOString()};}
function prototypeUnpack(v){

 }
};
